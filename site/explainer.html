<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An editable viz-explain pattern." />
    <title>viz-explain</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  </head>
  <body data-page="detail" data-base="../../" data-slug="%%SLUG%%">
    <header class="site-header detail-header">
      <a class="wordmark" href="../../" aria-label="Back to viz-explain">
        <span class="wordmark-mark back" aria-hidden="true">←</span>
        <span>viz-explain</span>
      </a>
      <div class="edit-status" id="edit-status"><span class="status-dot"></span> Editable canvas</div>
    </header>

    <main class="detail-main">
      <section class="detail-intro" id="detail-intro" aria-live="polite"></section>
      <section class="canvas-section" aria-label="Editable Excalidraw example">
        <div class="canvas-toolbar">
          <span id="canvas-label">OpenClaw example</span>
          <div class="canvas-actions">
            <button id="copy-canvas" class="canvas-button copy-button" type="button">Copy edit for agent</button>
            <button id="reset-canvas" class="canvas-button" type="button">Reset example</button>
          </div>
        </div>
        <div id="excalidraw-root" class="excalidraw-root">
          <div class="canvas-loading">Sharpening pencils…</div>
        </div>
      </section>
    </main>
    <script type="module" src="../../app.js"></script>
  </body>
</html>
